sentence=Centisecond-resolution clock built on a DS3231 RTC, synced to its own 1Hz tick.
paragraph=Reads whole seconds straight from a DS3231 and fills in centisecond (10ms) resolution from millis(), resynced on every second so the MCU's own clock drift never has time to build up. I2C only - no SQW/interrupt wiring needed.
